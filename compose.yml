# NATS JetStream + Quarkus (SmallRye Reactive Messaging) + Node/TypeScript demo.
# Run:  docker compose up --build
# UI:   http://localhost:8088
name: nats-demo

services:
  # Node 1: the message broker. JetStream enabled (-js), HTTP monitoring on 8222.
  nats:
    image: nats:2.12-alpine
    command: ['-js', '-m', '8222', '--store_dir', '/data']
    ports:
      - '127.0.0.1:4222:4222' # client connections
      - '127.0.0.1:8222:8222' # monitoring UI (http://localhost:8222)
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Node 3: NodeJS + TypeScript. Serves the web UI, bridges it to NATS
  # (REST + SSE), creates the DEMO JetStream stream, answers demo.echo,
  # and joins the demo.work queue group.
  node-service:
    build: ./node-service
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - '127.0.0.1:8088:8080' # web UI + API
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node 2: Quarkus + SmallRye Reactive Messaging (Quarkiverse NATS JetStream
  # connector). Consumes the DEMO stream (durable consumer), publishes ticks,
  # answers demo.greet, and joins the demo.work queue group.
  # Starts after node-service so the DEMO stream already exists.
  quarkus-service:
    build: ./quarkus-service
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - '127.0.0.1:8089:8080' # http://localhost:8089/health
    depends_on:
      nats:
        condition: service_healthy
      node-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /health HTTP/1.0\r\n\r" >&3 && head -1 <&3 | grep -q 200']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nats-data:
