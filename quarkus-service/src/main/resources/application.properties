# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# --- NATS connection (Quarkiverse JetStream connector) ---
quarkus.messaging.nats.connection.servers=${NATS_URL:nats://localhost:4222}

# JetStream consumer used by the incoming channel below.
# The DEMO stream itself is created by the node-service on startup.
quarkus.messaging.nats.consumers."quarkus-events".name=quarkus-events
quarkus.messaging.nats.consumers."quarkus-events".stream=DEMO
quarkus.messaging.nats.consumers."quarkus-events".durable=true
quarkus.messaging.nats.consumers."quarkus-events".filter-subject=demo.events.>

# Incoming channel: consume persisted demo.events.> messages from the DEMO stream
mp.messaging.incoming.events.connector=quarkus-jetstream
mp.messaging.incoming.events.consumer=quarkus-events
mp.messaging.incoming.events.stream=DEMO

# Outgoing channel: publish ticks into the DEMO stream (subject demo.quarkus.ticks)
mp.messaging.outgoing.ticks.connector=quarkus-jetstream
mp.messaging.outgoing.ticks.stream=DEMO
mp.messaging.outgoing.ticks.subject=demo.quarkus.ticks

# Plain NATS URL for the core request/reply + queue-group bean (jnats)
nats.url=${NATS_URL:nats://localhost:4222}
